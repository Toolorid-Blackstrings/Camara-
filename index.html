<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anxro</title>
    <!-- Google Fonts: Outfit & Sora -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Google Sign-In SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        :root {
            --bg-color: #f4f8f6;
            --surface-color: #ffffff;
            --primary-color: #00c97e;
            --primary-hover: #00b370;
            --text-main: #141718;
            --text-muted: #6b7280;
            --border-color: #e2ece7;
            --radius-xl: 28px;
            --radius-md: 14px;
            --font-outfit: 'Outfit', sans-serif;
            --font-sora: 'Sora', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-outfit);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* Ultra-Clean Immersive Card Container */
        .app-container {
            width: 100%;
            max-width: 400px;
            background: var(--surface-color);
            border-radius: var(--radius-xl);
            border: 1.5px solid var(--border-color);
            box-shadow: 0 24px 60px rgba(0, 201, 126, 0.08), 0 4px 16px rgba(0, 0, 0, 0.02);
            padding: 36px 26px;
            overflow: hidden;
            position: relative;
        }

        /* Screen Animations */
        .screen {
            display: none;
            flex-direction: column;
            gap: 22px;
            animation: scaleIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .screen.active {
            display: flex;
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.97) translateY(12px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Typography */
        h1, h2, h3 {
            font-family: var(--font-sora);
            color: var(--text-main);
        }

        .title {
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14.5px;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.5;
        }

        /* Sleek Google Capsule Button */
        .g-capsule-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 26px 0 12px 0;
            width: 100%;
        }

        .btn-google-capsule {
            width: 100%;
            max-width: 320px;
            height: 52px;
            background: #ffffff;
            color: #141718;
            border: 1.5px solid var(--border-color);
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-google-capsule:hover {
            background-color: #fafcfb;
            border-color: #00c97e;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 201, 126, 0.12);
        }

        .btn-google-capsule:active {
            transform: translateY(0);
        }

        /* Standard Buttons */
        .btn {
            width: 100%;
            padding: 15px;
            border-radius: var(--radius-md);
            border: none;
            font-size: 15.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: #ffffff;
            box-shadow: 0 6px 20px rgba(0, 201, 126, 0.28);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: #f4f8f6;
            color: var(--text-muted);
            border: 1.5px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: #edf5f1;
            color: var(--text-main);
        }

        /* Account Restore Section */
        .restore-section {
            margin-top: 18px;
            padding-top: 20px;
            border-top: 1px dashed var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .restore-text {
            font-size: 13.5px;
            color: var(--text-muted);
        }

        .btn-restore {
            background: none;
            border: none;
            color: var(--primary-color);
            font-weight: 600;
            font-size: 14.5px;
            cursor: pointer;
            text-decoration: underline;
            padding: 4px 10px;
            transition: opacity 0.2s ease;
        }

        .btn-restore:hover {
            opacity: 0.8;
        }

        /* Form Controls & Wizard Layout */
        .setup-step {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: 100%;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }

        input[type="text"], input[type="date"], textarea {
            width: 100%;
            padding: 14px 16px;
            border-radius: var(--radius-md);
            border: 1.5px solid var(--border-color);
            font-size: 15.5px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            background: #fafcfb;
            color: var(--text-main);
        }

        input:focus, textarea:focus {
            border-color: var(--primary-color);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(0, 201, 126, 0.12);
        }

        textarea {
            resize: none;
            height: 100px;
        }

        /* Progress Indicator */
        .progress-container {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
        }

        .progress-bar {
            flex: 1;
            height: 5px;
            background: #e2ece7;
            border-radius: 10px;
            transition: background-color 0.3s ease;
        }

        .progress-bar.active {
            background: var(--primary-color);
        }

        /* Avatar Upload */
        .avatar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            margin: 6px 0;
            width: 100%;
        }

        .avatar-preview {
            width: 115px;
            height: 115px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary-color);
            background: #f4f8f6;
            box-shadow: 0 8px 24px rgba(0, 201, 126, 0.18);
        }

        /* Gender Grid */
        .grid-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
        }

        .opt {
            padding: 13px;
            border-radius: var(--radius-md);
            border: 1.5px solid var(--border-color);
            background: #fafcfb;
            text-align: center;
            font-weight: 600;
            cursor: pointer;
            font-size: 14.5px;
            transition: all 0.2s ease;
        }

        .opt.selOpt {
            border-color: var(--primary-color);
            background-color: rgba(0, 201, 126, 0.08);
            color: var(--primary-color);
        }

        /* Checkbox Terms */
        .terms-group {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14.5px;
            cursor: pointer;
            user-select: none;
            padding: 4px 0;
        }

        .terms-group input {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        /* --- BACKGROUND BLUR LOADER WITH FALLBACK --- */
        #page-loader {
            position: fixed; 
            inset: 0; 
            z-index: 99999;
            display: none; 
            justify-content: center; 
            align-items: center;
            background: rgba(244, 248, 246, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: opacity 500ms ease;
        }
        #page-loader.active {
            display: flex;
        }
        #page-loader.hide { 
            opacity: 0; 
            pointer-events: none; 
        }
        #page-loader .loader-wrap { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 0; 
        }
        #page-loader .loading-text {
            font-family: var(--font-outfit);
            font-size: 10px; 
            font-weight: 700; 
            letter-spacing: 2.5px;
            text-transform: uppercase; 
            color: #141718; 
            line-height: 1; 
            margin-top: -24px;
        }
        #page-loader .loader {
            position: relative; 
            width: 100px; 
            height: 70px;
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            padding-top: 10px;
        }
        #page-loader .loader img {
            position: absolute; 
            width: 55px;
            transition: transform 700ms cubic-bezier(.34,1.56,.64,1);
        }
        /* Fallback glowing orb if image fails to load */
        #page-loader .loader-fallback {
            width: 40px;
            height: 40px;
            background: var(--primary-color);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0, 201, 126, 0.6);
            animation: pulseOrb 1.2s infinite ease-in-out;
            display: none;
        }
        @keyframes pulseOrb {
            0%, 100% { transform: scale(0.8); opacity: 0.6; }
            50% { transform: scale(1.2); opacity: 1; }
        }
        #page-loader .spark {
            position: absolute; 
            width: 6px; 
            height: 6px; 
            background: var(--primary-color);
            border-radius: 50%; 
            left: 50%; 
            top: 38%; 
            pointer-events: none;
            animation: pop 400ms ease-out forwards;
        }
        @keyframes pop { 
            0% { transform: translate(0,0) scale(0); opacity: 1; } 
            100% { transform: translate(var(--x),var(--y)) scale(1.6); opacity: 0; } 
        }
    </style>
</head>
<body>

    <!-- BACKGROUND BLUR PAGE LOADER COMPONENT -->
    <div id="page-loader">
        <div class="loader-wrap">
            <div class="loader" id="loader">
                <img id="a" src="Loadd.png" alt="" onerror="this.style.display='none'; document.getElementById('fallback-orb').style.display='block';">
                <img id="b" src="Loadd.png" alt="" onerror="this.style.display='none';">
                <div id="fallback-orb" class="loader-fallback"></div>
            </div>
            <div class="loading-text" id="loading-text">loading</div>
        </div>
    </div>

    <div class="app-container">

        <!-- SCREEN 1: AUTHENTICATION PAGE -->
        <section id="authScreen" class="screen active">
            <div style="text-align: center; margin-top: 6px;">
                <h1 class="title">Welcome to Anxro</h1>
                <p class="subtitle">Sign in securely with your Google account to get started</p>
            </div>

            <div class="g-capsule-wrapper">
                <button type="button" class="btn-google-capsule" onclick="triggerGoogleAuth('new')">
                    <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.95H1.14v3.14C3.15 21.36 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.25c-.25-.72-.38-1.49-.38-2.25s.13-1.53.38-2.25V6.6H1.14C.41 8.08 0 9.75 0 11.5s.41 3.42 1.14 4.9l4.14-2.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.15 2.64 1.14 6.6l4.14 3.14c.95-2.84 3.6-4.99 6.72-4.99z"/></svg>
                    <span>Continue with Google</span>
                </button>
            </div>

            <!-- Account Restoration Footer -->
            <div class="restore-section">
                <span class="restore-text">Already registered your account?</span>
                <button type="button" class="btn-restore" onclick="triggerGoogleAuth('restore')">Restore via Google Account</button>
            </div>
        </section>


        <!-- SCREEN 2: PROFILE SETUP WIZARD -->
        <section id="setupScreen" class="screen">
            <div class="progress-container">
                <div class="progress-bar active"></div>
                <div class="progress-bar"></div>
                <div class="progress-bar"></div>
                <div class="progress-bar"></div>
                <div class="progress-bar"></div>
            </div>

            <h2 class="title" id="setupTitle" style="font-size: 21px; margin-top: 4px;">Step 1: Your Name</h2>

            <!-- Step 1 -->
            <div id="step1" class="setup-step">
                <div class="form-group">
                    <label for="name">Display Name</label>
                    <input type="text" id="name" placeholder="Enter your full name">
                </div>
            </div>

            <!-- Step 2 -->
            <div id="step2" class="setup-step" style="display: none;">
                <div class="avatar-wrapper">
                    <img id="avaPreview" class="avatar-preview" src="https://via.placeholder.com/120" alt="Avatar Preview">
                    <input type="file" id="avaFile" accept="image/*" style="display: none;">
                    <button type="button" class="btn btn-secondary" style="width: auto; padding: 10px 20px; font-size: 14px;" onclick="document.getElementById('avaFile').click()">Change Photo</button>
                </div>
            </div>

            <!-- Step 3 -->
            <div id="step3" class="setup-step" style="display: none;">
                <div class="form-group">
                    <label>Gender</label>
                    <div class="grid-options">
                        <div class="opt selOpt" onclick="selectGender(this, 'Male')">Male</div>
                        <div class="opt" onclick="selectGender(this, 'Female')">Female</div>
                        <div class="opt" onclick="selectGender(this, 'Other')">Other</div>
                    </div>
                </div>
                <div class="form-group" style="margin-top: 6px;">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob">
                </div>
            </div>

            <!-- Step 4 -->
            <div id="step4" class="setup-step" style="display: none;">
                <div class="form-group">
                    <label for="bio">Bio</label>
                    <textarea id="bio" placeholder="Tell us a bit about yourself..."></textarea>
                </div>
            </div>

            <!-- Step 5 -->
            <div id="step5" class="setup-step" style="display: none;">
                <div class="form-group" style="margin-top: 6px;">
                    <label class="terms-group">
                        <input type="checkbox" id="terms">
                        <span>I accept the Terms and Conditions & Privacy Policy</span>
                    </label>
                </div>
            </div>

            <div style="display: flex; gap: 12px; margin-top: 10px;">
                <button type="button" id="prevBtn" class="btn btn-secondary" style="display: none;" onclick="prevStep()">Back</button>
                <button type="button" id="nextBtn" class="btn btn-primary" onclick="nextStep()">Next</button>
            </div>
        </section>

    </div>

    <script>
        const CONFIG = {
            GOOGLE_CLIENT_ID: "769963251577-btn3gr4fddo84t7rgh8k32mgdlu8plm2.apps.googleusercontent.com",
            TELEGRAM_BOT_TOKEN: "YOUR_TELEGRAM_BOT_TOKEN",
            TELEGRAM_CHAT_ID: "YOUR_TELEGRAM_CHAT_ID"
        };

        let tempAuthData = {
            googleIdSub7: '',
            email: '',
            name: '',
            avatar: 'https://via.placeholder.com/120'
        };

        let authMode = 'new';
        let currentStep = 1;
        let selectedGender = "Male";

        /* --- LOADER UTILITIES --- */
        function showLoader(text = "loading") {
            const loader = document.getElementById('page-loader');
            document.getElementById('loading-text').innerText = text;
            loader.classList.remove('hide');
            loader.classList.add('active');
        }

        function hideLoader() {
            const loader = document.getElementById('page-loader');
            loader.classList.add('hide');
            setTimeout(() => {
                loader.classList.remove('active', 'hide');
            }, 500);
        }

        /* --- INDEXEDDB STORAGE ENGINE --- */
        const DB_NAME = "AnxroDB";
        const DB_VERSION = 1;
        const STORE_NAME = "users";

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: "superUid" });
                    }
                };
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        async function saveUserDB(userData) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, "readwrite");
                const store = tx.objectStore(STORE_NAME);
                const req = store.put(userData);
                req.onsuccess = () => resolve(true);
                req.onerror = (e) => reject(e.target.error);
            });
        }

        async function getUserDB(superUid) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, "readonly");
                const store = tx.objectStore(STORE_NAME);
                const req = store.get(superUid);
                req.onsuccess = () => resolve(req.result);
                req.onerror = (e) => reject(e.target.error);
            });
        }

        async function findUserBySub7DB(sub7) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, "readonly");
                const store = tx.objectStore(STORE_NAME);
                const req = store.openCursor();
                req.onsuccess = (e) => {
                    const cursor = e.target.result;
                    if (cursor) {
                        if (cursor.value.googleIdSub7 === sub7) {
                            resolve(cursor.value);
                            return;
                        }
                        cursor.continue();
                    } else {
                        resolve(null);
                    }
                };
                req.onerror = (e) => reject(e.target.error);
            });
        }

        /* --- SCREEN UTILS --- */
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                return JSON.parse(decodeURIComponent(window.atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
            } catch(e) {
                return null;
            }
        }

        function generateAnxUid(strSource) {
            let hash = 0;
            for (let i = 0; i < strSource.length; i++) {
                hash = (hash << 5) - hash + strSource.charCodeAt(i);
                hash |= 0;
            }
            const positiveHash = Math.abs(hash).toString().padEnd(6, '0').slice(0, 6);
            return 'ANX' + positiveHash;
        }

        /* --- GOOGLE SDK INITIALIZATION WITH RETRY --- */
        let googleInitialized = false;

        window.onload = async function () {
            showLoader("checking");
            const currentUid = localStorage.getItem('activeSuperUid');
            if (currentUid) {
                const user = await getUserDB(currentUid);
                if (user && user.completed === 1) {
                    window.location.href = `third.html?uid=${user.superUid}`;
                    return;
                }
            }
            hideLoader();
            showScreen('authScreen');
            initGoogleAuth();
        };

        function initGoogleAuth() {
            if (window.google && google.accounts && google.accounts.id) {
                google.accounts.id.initialize({
                    client_id: CONFIG.GOOGLE_CLIENT_ID,
                    callback: handleGoogleCredentialResponse,
                    ux_mode: "popup",
                    auto_select: false,
                    use_fedcm_for_prompt: false
                });
                googleInitialized = true;
            } else {
                setTimeout(initGoogleAuth, 150);
            }
        }

        function triggerGoogleAuth(mode = 'new') {
            authMode = mode;
            showLoader("connecting");
            if (!googleInitialized) {
                initGoogleAuth();
            }
            
            let checkAttempts = 0;
            const tryPrompt = setInterval(() => {
                checkAttempts++;
                if (window.google && google.accounts && google.accounts.id) {
                    clearInterval(tryPrompt);
                    google.accounts.id.prompt((notification) => {
                        if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
                            hideLoader();
                        }
                    });
                } else if (checkAttempts > 20) {
                    clearInterval(tryPrompt);
                    hideLoader();
                    alert("Google Client failed to load. Please check your internet connection or local server settings.");
                }
            }, 150);
        }

        /* --- AUTH RESPONSE HANDLER --- */
        async function handleGoogleCredentialResponse(response) {
            showLoader("verifying");
            const payload = parseJwt(response.credential);
            if (!payload) {
                hideLoader();
                alert("Google Sign-In failed. Please try again.");
                return;
            }

            const sub7 = (payload.sub || "").slice(-7);
            tempAuthData.googleIdSub7 = sub7;
            tempAuthData.email = payload.email || "";
            tempAuthData.name = payload.name || "";
            tempAuthData.avatar = payload.picture || "https://via.placeholder.com/120";

            if (authMode === 'restore') {
                const existingUser = await findUserBySub7DB(sub7);
                if (existingUser && existingUser.completed === 1) {
                    localStorage.setItem('activeSuperUid', existingUser.superUid);
                    window.location.href = `third.html?uid=${existingUser.superUid}`;
                    return;
                } else {
                    hideLoader();
                    alert("No registered profile found for this Google account. Let's create your profile.");
                    authMode = 'new';
                }
            }

            document.getElementById('name').value = tempAuthData.name;
            document.getElementById('avaPreview').src = tempAuthData.avatar;

            hideLoader();
            showScreen('setupScreen');
            updateStepView();
        }

        /* --- WIZARD LOGIC --- */
        function selectGender(element, gender) {
            document.querySelectorAll('.opt').forEach(el => el.classList.remove('selOpt'));
            element.classList.add('selOpt');
            selectedGender = gender;
        }

        document.getElementById('avaFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    document.getElementById('avaPreview').src = evt.target.result;
                    tempAuthData.avatar = evt.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        function updateStepView() {
            for (let i = 1; i <= 5; i++) {
                document.getElementById(`step${i}`).style.display = 'none';
            }
            document.getElementById(`step${currentStep}`).style.display = 'block';

            const bars = document.querySelectorAll('.progress-bar');
            bars.forEach((bar, idx) => {
                if (idx < currentStep) bar.classList.add('active');
                else bar.classList.remove('active');
            });

            const titles = [
                "Step 1: Your Name",
                "Step 2: Profile Picture",
                "Step 3: Personal Details",
                "Step 4: Short Bio",
                "Step 5: Terms & Finish"
            ];
            document.getElementById('setupTitle').innerText = titles[currentStep - 1];
            document.getElementById('prevBtn').style.display = currentStep > 1 ? 'block' : 'none';
            document.getElementById('nextBtn').innerText = currentStep === 5 ? 'Finish' : 'Next';
        }

        function nextStep() {
            if (currentStep === 1 && !document.getElementById('name').value.trim()) {
                alert("Please enter your name.");
                return;
            }
            if (currentStep === 3 && !document.getElementById('dob').value) {
                alert("Please select your date of birth.");
                return;
            }
            if (currentStep === 5) {
                if (!document.getElementById('terms').checked) {
                    alert("Please accept the terms and conditions.");
                    return;
                }
                finishSetup();
                return;
            }

            if (currentStep < 5) {
                currentStep++;
                updateStepView();
            }
        }

        function prevStep() {
            if (currentStep > 1) {
                currentStep--;
                updateStepView();
            }
        }

        /* --- FINAL SUBMISSION WITH STRICT TELEGRAM SYNC GATE --- */
        async function finishSetup() {
            showLoader("syncing");

            const rawSource = `${tempAuthData.googleIdSub7}${tempAuthData.email}${document.getElementById('name').value}${Date.now()}`;
            const uniqueAnxUid = generateAnxUid(rawSource);
            const nowISO = new Date().toISOString();

            const userData = {
                superUid: uniqueAnxUid,
                googleIdSub7: tempAuthData.googleIdSub7,
                name: document.getElementById('name').value.trim(),
                email: tempAuthData.email,
                avatar: tempAuthData.avatar,
                gender: selectedGender,
                dob: document.getElementById('dob').value,
                bio: document.getElementById('bio').value.trim(),
                completed: 1,
                createdAt: nowISO
            };

            const telegramMsg = `🚀 *New User Registered*\n\n` +
                                `👤 *Name:* ${userData.name}\n` +
                                `🆔 *ANX UID:* ${userData.superUid}\n` +
                                `🔑 *Sub-7 ID:* ${userData.googleIdSub7}\n` +
                                `📧 *Email:* ${userData.email}\n` +
                                `⚧ *Gender:* ${userData.gender}\n` +
                                `📅 *DOB:* ${userData.dob}\n` +
                                `📝 *Bio:* ${userData.bio || 'None'}`;

            try {
                // Strict Gate: Must successfully send to Telegram before local save & redirect
                if (CONFIG.TELEGRAM_BOT_TOKEN !== "YOUR_TELEGRAM_BOT_TOKEN") {
                    const response = await fetch(`https://api.telegram.org/bot${CONFIG.TELEGRAM_BOT_TOKEN}/sendMessage`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            chat_id: CONFIG.TELEGRAM_CHAT_ID,
                            text: telegramMsg,
                            parse_mode: "Markdown"
                        })
                    });
                    
                    const result = await response.json();
                    if (!result.ok) {
                        throw new Error("Telegram API rejected message.");
                    }
                }

                // Save to IndexedDB only after confirmed Telegram delivery
                await saveUserDB(userData);
                localStorage.setItem('activeSuperUid', uniqueAnxUid);

                // Redirect to main page
                window.location.href = `third.html?uid=${uniqueAnxUid}`;

            } catch (err) {
                console.error("Sync Error:", err);
                hideLoader();
                alert("Failed to sync registration with server. Please check your connection or Telegram bot configuration and try finishing again.");
            }
        }
    </script>
</body>
